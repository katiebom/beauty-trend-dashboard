# 1.6: 특정 분야 세계적 권위 / 다수 전문의 집단 합의
# 1.5: 피부과 전문의 일반 / 화장품 포뮬러 전문가
# 1.4: 성분 분석 전문 / 시술 특화
# 1.3: 실전 팁 / 가성비 분석
# 1.2: 뷰티 인플루언서 (트렌드 감지)
