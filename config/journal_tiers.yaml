# 3-Tier Journal Classification — 화장품 성분 흐름 추적
# ─────────────────────────────────────────────────────────────────
# T1: Medical / Medical Aesthetic — 의료·시술용 (12~24개월 후 derma 진입)
# T2: Skinceutical / Dermocosmetic — 더마코스메틱 (6~12개월 후 매스 진입)
# T3: Mass Cosmetic — 일반 화장품/소비재
# ─────────────────────────────────────────────────────────────────
# 매칭: PubMed 결과의 'journal' 필드를 lowercase 부분일치
# 우선순위: T1 → T2 → T3 → unknown (Gemini 보강)
# ─────────────────────────────────────────────────────────────────

T1_medical_aesthetic:
