# 뷰티 성분 트렌드 추적 마스터 목록
# status: rising / falling / watching
# 새 성분 추가 시 이 파일에만 추가하면 수집 + 대시보드 자동 반영

ingredients:
  - id: ectoin
    name_kr: 엑토인
    name_en: Ectoin
    status: rising
    category: barrier
    replaces: [ceramide]           # 세라마이드 점유율 일부 흡수 중
    google_keywords:
      - "ectoin skincare"
      - "ectoine cream"
      - "ectoin 화장품"
    reddit_terms:
      - ectoin
      - ectoine
    added_date: "2026-04-18"
    notes: "세라마이드 대체 차세대 장벽 성분. 세포 스트레스 관리 키워드"

  - id: retinal
    name_kr: 레티날
    name_en: Retinal
    status: rising
    category: retinoid
    replaces: [retinol]            # 레티놀 전환 경로의 한 단계 앞 — 더 빠르고 덜 자극적
    relation_note: "레티놀보다 비타민A 전환 1단계 적음 (레티놀→레티날→레티노산)"
    google_keywords:
      - "retinal skincare"
      - "retinaldehyde serum"
      - "레티날 세럼"
    reddit_terms:
      - retinal
      - retinaldehyde
    added_date: "2026-04-18"
    notes: "레티놀보다 전환 단계 1단계 적음. 빠른 효과 + 낮은 자극"

  - id: beef_tallow
    name_kr: 비프 탈로우
    name_en: Beef Tallow
    status: rising
    category: moisturizer
    google_keywords:
      - "beef tallow skincare"
      - "tallow moisturizer"
      - "ancestral skincare"
    reddit_terms:
      - "beef tallow"
      - tallow
      - "ancestral skincare"
    added_date: "2026-04-18"
    notes: "틱톡 바이럴. Ancestral Skincare 트렌드. 천연 보습제"

  - id: pdrn_exosome
    name_kr: PDRN/엑소좀
    name_en: PDRN/Exosome
    status: rising
    category: regeneration
    google_keywords:
      - "PDRN skincare"
      - "exosome serum"
      - "엑소좀 세럼"
    reddit_terms:
      - PDRN
      - exosome
      - "exosome serum"
    added_date: "2026-04-18"
    notes: "메디컬 시술 대중화로 홈케어 수요 급증. 스킨부스터 성분"

  - id: retinol
    name_kr: 레티놀
    name_en: Retinol
    status: falling
    category: retinoid
    replaced_by: [retinal, bakuchiol]   # 진화형(레티날) + 대안(바쿠치올)에 이중 압박
    relation_note: "레티날(효능 업그레이드)·바쿠치올(자극 우려층) 양쪽에서 점유율 이탈"
    google_keywords:
      - "retinol serum"
      - "retinol cream"
      - "레티놀 세럼"
    reddit_terms:
      - retinol
    added_date: "2026-04-18"
    notes: "레티날/바쿠치올/캡슐화 레티놀에 점유율 이전 중"

  - id: vitamin_c_laa
    name_kr: 비타민C (L-AA)
    name_en: Vitamin C L-Ascorbic Acid
    status: falling
    category: brightening
    replaced_by: [thd_ascorbate]    # 안정화 유도체로 이동 (추후 추가 예정)
    relation_note: "산화 불안정·따가움 문제로 THD Ascorbate 등 유도체에 자리 내주는 중"
    google_keywords:
      - "vitamin c serum"
      - "L-ascorbic acid"
      - "비타민C 세럼"
    reddit_terms:
      - "L-ascorbic acid"
      - "vitamin c serum"
      - "LAA"
    added_date: "2026-04-18"
    notes: "산화 문제 + 따가움. THD Ascorbate 등 안정화 유도체로 이동"

  - id: high_aha
    name_kr: 고농도 AHA
    name_en: High-concentration AHA
    status: falling
    category: exfoliant
    replaced_by: [pha]             # 순한 각질 케어 수요가 PHA로 이동
    relation_note: "장벽 손상 우려로 고농도 필링 기피 → PHA·효소 기반 순한 제품 선호"
