    name_kr: 바쿠치올
    name_en: Bakuchiol
    status: watching
    category: retinoid_alternative
    replaces: [retinol]            # 자극 없는 레티놀 대안으로 포지셔닝
    relation_note: "레티놀 기피층(임산부·민감피부) 흡수. 레티날과는 다른 타겟"
    google_keywords:
