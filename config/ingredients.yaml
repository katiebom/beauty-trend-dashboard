      - "AHA exfoliant"
      - "glycolic acid high"
      - "AHA 각질제거"
    reddit_terms:
      - "high AHA"
      - "glycolic acid"
      - "AHA toner"
    added_date: "2026-04-18"
    notes: "피부 장벽 손상 공포. PHA/효소 기반 순한 제품으로 이동"

  - id: ceramide
    name_kr: 세라마이드
    name_en: Ceramide
    status: watching
    category: barrier
    replaced_by: [ectoin]          # 엑토인의 부상으로 모니터링 필요
    google_keywords:
      - "ceramide moisturizer"
      - "ceramide serum"
      - "세라마이드 크림"
    reddit_terms:
      - ceramide
      - ceramides
