# APLB 제품-성분 마스터
# ─────────────────────────────────────────────────────────────
# 구조: complexes (시그니처 컴플렉스) + products (개별 SKU)
# 시너지 분석은 complexes의 ingredients 페어로 PubMed 쿼리
# ─────────────────────────────────────────────────────────────

brand:
  id: "aplb"
  name_kr: "에이필리비"
  name_en: "APLB"
  signature_tech: "Microfluidizer (성분 미세 입자화 흡수 공법)"
  brand_dna: "Centella 3X Complex (마데카식애씨드 + 아시아티코사이드 + 아시아틱애씨드)"

# ── 시그니처 컴플렉스 (브랜드 IP) ──────────────────────────────
complexes:
  - id: "lipo_gluta_niac_cen"
    trade_mark: "LIPO GLUTA NIAC CEN™"
    name_kr: "글루타치온-나이아신아마이드-병풀 컴플렉스"
    composition:
      glutathione: "1000ppm"
      niacinamide: "1000ppm"
      centella_extract: "10%+"
    primary_ingredients: ["glutathione", "niacinamide", "centella"]
    pair_queries:
      # 기본 페어
      - ["glutathione", "niacinamide"]
      - ["glutathione", "centella"]
      - ["niacinamide", "centella"]
      # 동의어/의학 용어 변형 (G×N 근거 보강)
      - ["glutathione", "nicotinamide"]
      - ["GSH", "niacinamide"]
      - ["glutathione", "vitamin B3"]
      # 적응증 결합 (단일 성분도 적응증 매칭은 필수)
      - ["glutathione", "melasma"]
      - ["niacinamide", "melanin transfer"]
      - ["glutathione", "tyrosinase"]
      - ["niacinamide", "hyperpigmentation"]
      # 센텔라 활성 단일성분 매핑
      - ["asiaticoside", "skin"]
      - ["madecassoside", "skin"]
    trio_queries:
      - ["glutathione", "niacinamide", "centella"]
      - ["glutathione", "niacinamide", "asiaticoside"]
      - ["glutathione", "niacinamide", "madecassoside"]
    target_indications: ["hyperpigmentation", "melasma", "uneven_tone", "redness", "post_inflammatory"]
    bestseller: true
    notes: "브랜드 시그니처. 미백+진정 동시 타겟. 글루타치온은 2024-25 폭발 트렌드"

  - id: "collagen_pept_cen"
    trade_mark: "Collagen Pept Cen™"
    name_kr: "콜라겐-펩타이드-병풀 컴플렉스"
    composition:
      collagen: "29.4% (cream)"
      egf_peptide: "포함"
      centella_extract: "포함"
    primary_ingredients: ["collagen", "peptide", "egf", "centella"]
    pair_queries:
      - ["collagen", "peptide"]
      - ["peptide", "egf"]
      - ["collagen", "centella"]
    target_indications: ["wrinkle", "elasticity", "barrier", "anti_aging"]
    bestseller: false
    notes: "탄력+장벽. EGF 표기는 oligopeptide-1 등의 마케팅명 가능성 확인 필요"

  - id: "salicylic_arbutin_cen"
    trade_mark: "Salicylic Acid BHA Arbutin"
    name_kr: "BHA-아르부틴-병풀 라인"
    composition:
      salicylic_acid: "BHA"
      arbutin: "포함"
      centella_extract: "포함"
    primary_ingredients: ["salicylic_acid", "arbutin", "centella"]
    pair_queries:
      - ["salicylic acid", "arbutin"]
      - ["arbutin", "niacinamide"]   # 미백 페어 비교군
      - ["salicylic acid", "centella"]
    target_indications: ["acne", "post_acne_marks", "pore", "sebum", "blemish"]
    bestseller: false
    notes: "트러블+흔적 동시. 북미 acne care 시장 진입 자산"

  - id: "ha_b5_ceramide"
    trade_mark: "HA B5™"
    name_kr: "히알루론산-세라마이드-B5 컴플렉스"
    composition:
      hyaluronic_acid: "포함 (멀티 분자량 추정)"
      ceramide: "포함"
      panthenol_b5: "포함"
    primary_ingredients: ["hyaluronic_acid", "ceramide", "panthenol"]
    pair_queries:
      - ["ceramide", "hyaluronic acid"]
      - ["panthenol", "ceramide"]
      - ["squalane", "hyaluronic acid"]
    target_indications: ["dryness", "barrier", "sensitive", "dehydration"]
    bestseller: false
    notes: "보습+장벽. 세라마이드는 2024-25 핵심 트렌드"

# ── 단일/특수 기능성 (Complex 외) ──────────────────────────────
single_actives:
  - id: "tranexamic_niacinamide"
    name_kr: "트라넥삼산-나이아신아마이드"
    primary_ingredients: ["tranexamic_acid", "niacinamide"]
    pair_queries:
      - ["tranexamic acid", "niacinamide"]
      - ["tranexamic acid", "melasma"]
    target_indications: ["melasma", "hyperpigmentation"]
    notes: "예스스타일 타임딜 상위. 외용 트라넥삼산은 북미에서 폭발 중. 마케팅 강화 후보"

  - id: "retinol_vitamin_ce"
    name_kr: "레티놀-비타민C/E"
    primary_ingredients: ["retinol", "vitamin_c", "vitamin_e"]
    pair_queries:
      - ["retinol", "vitamin C"]
      - ["vitamin C", "vitamin E"]
      - ["retinol", "vitamin E"]
    target_indications: ["anti_aging", "antioxidant", "wrinkle"]
    notes: "이너 뷰티(태블릿) + 페이셜 크림 양쪽. '먹는 레티놀' 차별화"

  - id: "azelaic_peptide"
    name_kr: "아젤라익산-펩타이드"
    primary_ingredients: ["azelaic_acid", "peptide"]
    pair_queries:
      - ["azelaic acid", "rosacea"]
      - ["azelaic acid", "peptide"]
      - ["azelaic acid", "niacinamide"]
    target_indications: ["redness", "rosacea", "sensitive", "acne"]
    notes: "서구권 필수템. K-beauty 브랜드 중 외용 azelaic은 희소"

# ── 신제품 후보 — APLB 미보유, 트렌드 강한 성분 ────────────────
# 목적: APLB 보유 성분과 페어/트리오 시너지 검증 → 신제품 컨셉 도출
candidate_ingredients:
  - id: "exosome_aplb_synergy"
    name_kr: "엑소좀 (Medical → Cosmetic 가장 빠른 흐름)"
    primary_ingredients: ["exosome"]
    rationale: |
      Medical aesthetic(중간엽 줄기세포 엑소좀, PDRN 인접)에서 코스메틱으로
      가장 빠르게 이동 중. APLB 미보유 → 1순위 신제품 후보.
      식약처 화장품 신원료 등재 트렌드 + 북미/일본 derma 브랜드 적극 도입.
    pair_queries:
      # APLB 핵심 보유 성분과의 시너지 (전부 신제품 페어 후보)
      - ["exosome", "glutathione"]
      - ["exosome", "niacinamide"]
      - ["exosome", "centella"]
      - ["exosome", "asiaticoside"]
      - ["exosome", "peptide"]
      - ["exosome", "ceramide"]
      - ["exosome", "hyaluronic acid"]
      - ["exosome", "tranexamic acid"]
      - ["exosome", "retinol"]
      # 메커니즘 + 적응증
      - ["exosome", "skin regeneration"]
      - ["exosome", "wound healing skin"]
      - ["exosome", "hyperpigmentation"]
      - ["exosome", "anti-aging skin"]
      # 식물성/안전성 (코스메틱 등재 트렌드)
      - ["plant-derived exosome", "skin"]
      - ["exosome-like nanovesicle", "skin"]
    trio_queries:
      # APLB 시그니처 컴플렉스에 엑소좀 추가 시 시너지 검증
      - ["exosome", "glutathione", "niacinamide"]
      - ["exosome", "niacinamide", "centella"]
      - ["exosome", "ceramide", "hyaluronic acid"]
      - ["exosome", "peptide", "centella"]
    target_indications: ["regeneration", "anti_aging", "post_procedure_recovery", "barrier", "hyperpigmentation"]
    notes: |
      신제품 컨셉 후보:
      1) "LIPO GLUTA NIAC CEN™ + Exosome" — 미백 컴플렉스 강화판
      2) "Centella + Exosome Recovery Ampoule" — 시술 후 회복 포지셔닝
      3) "Plant Exosome + HA B5" — 비건 친화 보습/장벽 라인

