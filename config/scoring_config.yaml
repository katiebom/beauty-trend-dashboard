# ============================================================
# 지표 점수 기준 설정
# 여기를 수정하면 대시보드 방법론 탭에 자동 반영됩니다
# ============================================================

v_index:
  name: "V-Index (Velocity Index) v2"
  description: "Google Trends 검색 관심도의 가속도 + 로그 절대값 + YoY 계절성 보정"

  data_source: "Google Trends (pytrends)"
  update_frequency: "주 1회 (매주 월요일)"
  lookback_window: "5년 주간 데이터 (YoY 계산용)"

  calculation:
    step1: "최근 12주 평균(recent_avg) vs 이전 12주 평균(prev_avg) 계산"
    step2: "ratio = recent_avg / prev_avg"
    step3: "velocity = clip((ratio - 1.0) × 100, -100, +100)  →  0배=-100, 1.0배=0, 2.0배=+100"
    step4: "log_absolute = log1p(recent_avg) / log1p(100) × 100  (신규 성분 착시 보정)"
    step5: "yoy_factor: 전년 동기 대비 성장률 1.1 미만이면서 단기 급등이면 seasonality_factor=0.65"
    step6: "V-Index = clip((velocity×0.6 + log_absolute×0.4) × seasonality_factor, -100, +100)"

  weights:
    velocity: 0.6
    log_absolute: 0.4
    seasonality_penalty: 0.65   # 계절성 의심 시 적용

  score_ranges:
    - min: -100
      max: -30
      label: "명확한 하락"
      color: "#b71c1c"
      meaning: "검색량 30~100% 감소 중. '지는 해' 성분."
      action: "신규 투자 중단. 기존 제품 단계적 리포지셔닝 검토."

    - min: -30
      max: 0
      label: "완만한 하락"
      color: "#ef5350"
      meaning: "소폭 감소 중. 성숙기 진입 또는 대체 성분 등장."
      action: "R-Score·ET-Score 높으면 코어 성분 유지. 낮으면 축소."

    - min: 0
      max: 20
      label: "보합"
      color: "#ff9800"
      meaning: "검색량 변화 거의 없음. 0 = 완전히 변화 없음."
      action: "현상 유지. 다른 지표로 판단."

    - min: 20
      max: 50
      label: "완만한 상승"
      color: "#fdd835"
      meaning: "이전 대비 약 1.2~1.5배 성장 중."
      action: "신제품 기획 후보. 선점 타이밍 검토."

    - min: 50
      max: 80
      label: "빠른 성장"
      color: "#66bb6a"
      meaning: "이전 대비 1.5~2배 이상. 명확한 트렌드."
      action: "적극적 브랜딩 소재. 경쟁사 선점 여부 확인."

    - min: 80
      max: 100
      label: "바이럴 폭발"
      color: "#00c853"
      meaning: "2배+ 급등. 단, ⚠️ 계절성 플래그 확인 필수."
      action: "ET-Score 높으면 올인. 낮으면 R+ET 검증 후 판단."

  known_limitations:
    - "Google Trends는 절대 검색량이 아닌 상대 관심도 (최고점=100)"
    - "5개 키워드 배치 제한 → 키워드 간 상대 비교만 가능"
    - "YoY 계산은 52주+ 데이터 있을 때만 유효 (신규 성분은 계절성 미적용)"
    - "로그 스케일로 신규 성분 착시는 개선됐으나, 완전한 카테고리 내 상대화는 아님"


r_score:
  name: "R-Score (Retention & Reddit Score) v3"
  description: "대규모 수집 → 2단계 파이프라인(필터링+클러스터링) → 가중 합산 수식"

  data_source: "Reddit (r/SkincareAddiction, r/AsianBeauty, r/DIYBeauty)"
  update_frequency: "주 1회 (매주 월요일)"
  lookback_window: "최근 90일 게시글 + 댓글, 성분당 수백~수천 건 수집"
  analyzer: "수식 직접 계산 (Claude는 Pain Points·Insight·Hype 판단만)"

  collection_scale:
    posts_per_subreddit: 50
    comments_per_post: 30
    estimated_total: "성분당 수백~수천 건"

  pipeline:
    stage1_filter: "감정 키워드 포함 텍스트만 추출 (단순 언급 제외)"
    sentiment_types: "strong_positive(+1) / positive(+0.5) / question(0) / negative(-0.5) / strong_negative(-1)"
    stage2_cluster: "Jaccard 토큰 유사도(임계값 0.35)로 유사 의견 그룹화"
    claude_input: "상위 15개 클러스터의 대표문장+빈도만 전달 → Pain Points/Insight 추출"

  calculation:
    formula: "R_Score = Σ(sentiment_val × engagement_weight × authority_weight) / Σ(eng_w × auth_w)"
    step1: "sentiment_val: strong_positive=+1, positive=+0.5, question=0, negative=-0.5, strong_negative=-1"
    step2: "engagement_weight = log1p(upvotes) × log1p(num_comments+1)"
    step3: "authority_weight: 전문가 flair 2~3×, 고karma 계정 1.3×, 신규 계정 0.7×"
    step4: "weighted_avg = numerator / denominator  →  범위: -1.0 ~ +1.0"
    step5: "R_Score = (weighted_avg + 1.0) / 2.0 × 100  →  0~100"
    step6: "Hype 감지 시 -12점 (브랜드 편중 28%+), Claude Hype 의심 시 추가 -12점"

  share_of_voice:
    definition: "전체 수집 건수 중 감정 언급 비중 (%)"
    usage: "V-Index 보조 지표 — 절대 검색량 대신 커뮤니티 내 점유율"

  score_ranges:
    - min: 0
      max: 30
      label: "부정 우세"
      color: "#ef5350"
      meaning: "가중 합산 결과 부정 의견이 압도적. 고engagement 부작용 후기 존재."
      action: "제품 포트폴리오 제외 검토. Pain Points 분석 후 포뮬레이션 개선 필요."

    - min: 30
      max: 50
      label: "혼조"
      color: "#ff9800"
      meaning: "긍부정 팽팽. 피부 타입 의존도 높거나 사용법 이슈 가능성."
      action: "타겟 피부 타입 좁혀 포지셔닝. Unmet Needs 활용 제품 차별화."

    - min: 50
      max: 70
      label: "대체로 긍정"
      color: "#fdd835"
      meaning: "긍정 가중치 우세. 일부 Pain Points 잔존."
      action: "Pain Points 해결하면 70+ 진입 가능. 포뮬레이션 개선 병행."

    - min: 70
      max: 85
      label: "높은 신뢰도"
      color: "#66bb6a"
      meaning: "고engagement 긍정 후기 다수. 커뮤니티 내 검증 완료 수준."
      action: "핵심 성분으로 확정. '커뮤니티 검증 성분' 마케팅 소재 활용."

    - min: 85
      max: 100
      label: "압도적 호평 (HG 수준)"
      color: "#00c853"
      meaning: "전문가 + 일반 유저 모두 강추. Holy Grail 언급 빈도 높음."
      action: "시그니처 성분 확정. 가격 프리미엄 + Strong Claim 가능."

  known_limitations:
    - "Reddit 영어권 중심 → K-뷰티 기능성 성분은 한국 커뮤니티(올리브영앱 리뷰 등) 데이터 추가 권장"
    - "Jaccard 클러스터링은 단어 기반 — 의미적으로 같아도 다른 단어면 분리될 수 있음"
    - "engagement_weight = 0인 댓글(downvoted)은 실질적 가중치 없음 (의도된 설계)"
    - "Hype 감지 오탐 가능 — 감점 전 hype_brands 필드 수동 확인 권장"
    - "질문형(question) 의견은 sentiment_val=0 처리 → R-Score에 영향 없음 (의도된 설계)"


et_index:
  name: "ET-Index (Expert Trust Index)"
  description: "피부과 전문의 YouTube 채널에서 성분 언급 빈도 + 권장 강도"

  data_source: "YouTube Data API v3 + YouTube Transcript API"
  update_frequency: "주 1회 (매주 월요일)"
  lookback_window: "최근 90일 영상, 채널당 최대 10개"
  channels_config: "config/youtube_channels.yaml (채널 추가/비활성화)"
  analyzer: "Claude Sonnet — 권장 강도 분류 + 임상 근거 여부 판단"

  calculation:
    step1: "활성화된 채널에서 성분 키워드 검색 (YouTube Search API)"
    step2: "영상 제목 + 설명 + 자막(transcript) 수집"
    step3: "Claude가 권장 강도 분류: strong_recommend / moderate / neutral / caution / against"
    step4: "raw_et_score (0~100) × authority_weight (1.0~1.8) → et_score"
    step5: "임상 근거 인용 시 +5점 보너스"
    step6: "채널별 ET-Score를 단순 평균 (언급 없는 채널 제외)"

  authority_weights:
    dermatologist: 1.5
    cosmetic_surgeon: 1.3
    pharmacist: 1.2
    general_medical: 1.2
    academic_researcher: 1.8

  recommendation_strength_map:
    strong_recommend: "강력 권장 — 임상 근거 + 적극 추천"
    moderate_recommend: "권장 — 긍정적 언급, 조건부 추천"
    neutral: "중립 — 성분 설명 수준, 권장/비권장 없음"
    caution: "주의 필요 — 특정 피부 타입/농도 주의 언급"
    against: "권장 안함 — 부작용/과학적 근거 부족 지적"
    not_mentioned: "언급 없음 — 데이터 없음 (점수 제외)"

  score_ranges:
    - min: 0
      max: 20
      label: "전문의 비권장"
      color: "#ef5350"
      meaning: "전문의들이 주의 또는 비추천. 과학적 근거 부족 가능성."
      action: "제품화 리스크 높음. 안전성 임상 데이터 확보 선행 필요."

    - min: 20
      max: 45
      label: "중립/미언급"
      color: "#ff9800"
      meaning: "언급은 있으나 적극 권장 없음. 또는 데이터 부족."
      action: "R-Score·V-Index 보완으로 판단. 단독으로는 근거 불충분."

    - min: 45
      max: 65
      label: "긍정적 언급"
      color: "#fdd835"
      meaning: "전문의 일부가 긍정적으로 언급. 근거 수준 확인 필요."
      action: "채널별 상세 내용 검토. 임상 근거 인용 여부 중요."

    - min: 65
      max: 85
      label: "전문의 권장"
      color: "#66bb6a"
      meaning: "여러 전문의가 효능 인정 + 권장. 임상 근거 보유."
      action: "브랜드 신뢰도 소재로 활용 가능. '전문의 추천' 마케팅 유효."

    - min: 85
      max: 100
      label: "전문의 강력 권장"
      color: "#00c853"
      meaning: "임상 근거 인용 + 다수 전문의 적극 추천. 최고 신뢰도."
      action: "출시 확신 근거로 활용. 가격 프리미엄 + 클레임 강화 가능."

  known_limitations:
    - "YouTube API 일일 할당량 제한 있음 (10,000 units/day) — 채널 수 조절 필요"
    - "자막 없는 영상은 제목+설명만 분석 → 정확도 낮음"
    - "한국어 영상은 자막 인식 품질이 영어 대비 낮을 수 있음"
    - "채널 활성화는 youtube_channels.yaml에서 수동 관리 (URL 확인 후 active: true)"


final_score:
  name: "Final Score"
  description: "V × 0.3 + R × 0.3 + ET × 0.4 가중 합산"
  formula: "FinalScore = V_normalized×0.3 + R_weighted×0.3 + ET×0.4"
  note: "V-Index는 -100~+100이므로 정규화: V_normalized = (V + 100) / 2 → 0~100 변환 후 합산"

  weights:
    v_index: 0.3    # 시장 관심 가속도
    r_score: 0.3    # 실사용자 신뢰도
    et_index: 0.4   # 전문의 검증 (가장 높은 가중치 — '안전·효능' 근거)

  et_fallback: "ET 데이터 없을 시 V:R = 0.5:0.5로 자동 조정"

  thresholds:
    launch_ready: 70      # 이 이상이면 신제품 기획 착수 권장
    watch: 50             # 50~70: 모니터링 지속
    deprioritize: 30      # 30 미만: 우선순위 낮춤


combined_interpretation:
  description: "V-Index + R-Score 2×2 매트릭스 해석 (ET는 보조)"
  quadrants:
    - v_range: "50~100"
      r_range: "70~100"
      label: "⭐ 핵심 유망 성분"
      action: "신제품 메인 성분 후보. ET-Score 65+ 확인 후 기획 착수."

    - v_range: "50~100"
      r_range: "0~50"
      label: "⚡ 바이럴 but 검증 필요"
      action: "트렌드 실재하나 효과 논란. ET-Score로 전문가 검증 필수."

    - v_range: "-100~20"
      r_range: "70~100"
      label: "💎 숨은 고관여 성분"
      action: "대중 인지 낮지만 코어 충성도 높음. 니치 프리미엄 기회."

    - v_range: "-100~20"
      r_range: "0~50"
      label: "📉 관심 저하"
      action: "신규 투자 보류. ET-Score 높으면 전문가용 클리니컬 포지션만."
